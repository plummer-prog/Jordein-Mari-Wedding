<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find Your Seat – Jordein & Mari's Wedding</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
    --brown: #654321;
    --moss: #4A5D23;
    --gold: #d4af37;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    background: linear-gradient(135deg, #3e2c1c, #3f4d23);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ===== GLASS PANEL ===== */

.overlay {
    width: 95%;
    max-width: 1000px;
    padding: 70px 50px;
    border-radius: 30px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(18px);
    text-align: center;
    box-shadow:
        0 40px 100px rgba(0,0,0,0.6),
        inset 0 0 0 1px rgba(255,255,255,0.08);
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== HEADER ===== */

.header { margin-bottom: 40px; }

.names {
    margin: 0;
    font-family: 'Playfair Display', serif;
    font-size: clamp(52px, 8vw, 72px);
    font-weight: 700;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow:
        0 4px 20px rgba(0,0,0,0.6),
        0 0 25px rgba(255,255,255,0.15);
}

.names span {
    color: var(--gold);
    font-weight: 400;
}

.divider {
    width: 120px;
    height: 2px;
    margin: 18px auto;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
}

.wedding-day {
    margin: 0;
    font-size: clamp(20px, 3vw, 26px);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
}

/* ===== SEARCH ===== */

p {
    margin-top: 30px;
    font-size: 22px;
}

input {
    width: 100%;
    max-width: 440px;
    padding: 18px 20px;
    font-size: 18px;
    border-radius: 30px;
    border: 2px solid var(--gold);
    margin-top: 24px;
    background: rgba(255,255,255,0.05);
    color: white;
    transition: all 0.3s ease;
}

input::placeholder {
    color: rgba(255,255,255,0.6);
}

input:focus {
    outline: none;
    border-color: white;
    box-shadow: 0 0 25px rgba(255,255,255,0.25);
}

/* ===== RESULT ===== */

.result {
    margin-top: 40px;
    padding: 40px;
    border-radius: 25px;
    font-size: 22px;
    min-height: 120px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
}

.result strong {
    display: block;
    font-size: 28px;
    margin-top: 12px;
    color: var(--gold);
}

/* ===== PHOTO ===== */

.couple-photo {
    margin: 25px auto;
    max-width: 600px;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}

.couple-photo img {
    width: 100%;
    display: block;
}

/* ===== FLOORPLAN ===== */

.floorplan-viewport {
    margin: 50px auto 0;
    max-width: 900px;
    border-radius: 25px;
    overflow: hidden;
    border: 2px solid var(--gold);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: none;
}

.floorplan-container { position: relative; }

.floorplan-container img {
    width: 100%;
    display: block;
}

.table-marker {
    position: absolute;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--gold);
    border: 4px solid white;
    transform: translate(-50%, -50%);
    display: none;
    animation: pulse 2s infinite ease-in-out;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 8px rgba(255,255,255,0.2); }
    50% { box-shadow: 0 0 0 18px rgba(255,255,255,0.1); }
    100% { box-shadow: 0 0 0 8px rgba(255,255,255,0.2); }
}

.table-label {
    position: absolute;
    transform: translate(-50%, -150%);
    background: rgba(0,0,0,0.85);
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    color: var(--gold);
    white-space: nowrap;
    display: none;
}

.visible { display: block !important; }

.footer {
    margin-top: 60px;
    font-size: 20px;
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="overlay">

    <div class="header">
        <h1 class="names">Jordein <span>&</span> Mari</h1>
        <div class="divider"></div>
        <h2 class="wedding-day">Wedding Celebration</h2>
    </div>

    <p>Search your name to find your seat</p>
    <input id="searchBox" placeholder="Enter your first or full name">

    <div id="result" class="result">
        <div class="couple-photo">
            <img src="https://nomanisanisland8.wordpress.com/wp-content/uploads/2026/02/img_0567.png" alt="Jordein & Mari">
        </div>
    </div>

    <div id="viewport" class="floorplan-viewport">
        <div class="floorplan-container">
            <img src="https://nomanisanisland8.wordpress.com/wp-content/uploads/2026/02/img_0557.jpg" alt="Floorplan">
            <div id="marker" class="table-marker"></div>
            <div id="label" class="table-label"></div>
        </div>
    </div>

    <div class="footer">
        We are so happy to celebrate with you 🤍💚🤎
    </div>
</div>

<script>

const tablePositions = {
    eddie: { x: 48.41, y: 17.40, label: "Eddie" },
    travelingtogether: { x: 19.89, y: 50.72, label: "Traveling Together" },
    southshore: { x: 50.80, y: 53.27, label: "South Shore" },
    oldfashioned: { x: 82.23, y: 51.08, label: "IPA & Old Fashioned" },
    morningcoffee: { x: 63.53, y: 80.51, label: "Morning Coffee" },
    fiserv: { x: 36.87, y: 80.02, label: "Fiserv" }
};

const guests = {
    /* EDDIE */
    "michele lucco": {table:"eddie", display:"Michele Lucco"},
    "jim lucco": {table:"eddie", display:"Jim Lucco"},
    "brenda panton": {table:"eddie", display:"Brenda Panton"},
    "sandy plummer": {table:"eddie", display:"Sandy Plummer"},
    "stacie plummer": {table:"eddie", display:"Stacie Plummer"},
    "donte green": {table:"eddie", display:"Donte Green"},
    "kendra green": {table:"eddie", display:"Kendra Green"},
    "kaelyn green": {table:"eddie", display:"Kaelyn Green"},
    "maze green": {table:"eddie", display:"Maze Green"},
    "kaylee corr": {table:"eddie", display:"Kaylee Corr"},
    "ryan corr": {table:"eddie", display:"Ryan Corr"},
    "adeline corr": {table:"eddie", display:"Adeline Corr"},
    "henry corr": {table:"eddie", display:"Henry Corr"},
    "joseph lucco": {table:"eddie", display:"Joseph Lucco"},
    "emily lucco": {table:"eddie", display:"Emily Lucco"},
    "peter lucco": {table:"eddie", display:"Peter Lucco"},
    "nora lucco": {table:"eddie", display:"Nora Lucco"},
    "carol plummer": {table:"eddie", display:"Carol Plummer"},

    /* SOUTH SHORE */
    "michael mcneill": {table:"southshore", display:"Michael McNeill"},
    "chris mcneill": {table:"southshore", display:"Chris McNeill"},
    "denise mcneill": {table:"southshore", display:"Denise McNeill"},
    "leeann terhune": {table:"southshore", display:"LeeAnn Terhune"},
    "gary terhune": {table:"southshore", display:"Gary Terhune"},
    "peter mcneill": {table:"southshore", display:"Peter McNeill"},
    "karen demun": {table:"southshore", display:"Karen DeMun"},

    /* FISERV */
    "andrew kaczmarek": {table:"fiserv", display:"Andrew Kaczmarek"},
    "alison kaczmarek": {table:"fiserv", display:"Alison Kaczmarek"},
    "jen reuteman": {table:"fiserv", display:"Jen Reuteman"},
    "john retueman": {table:"fiserv", display:"John Retueman"},
    "clare morin": {table:"fiserv", display:"Clare Morin"},
    "mallory mowbray": {table:"fiserv", display:"Mallory Mowbray"},
    "reese mowbray": {table:"fiserv", display:"Reese Mowbray"},
   

    /* OLD FASHIONED */
    "paula morehouse": {table:"oldfashioned", display:"Paula Morehouse"},
    "jack morehouse": {table:"oldfashioned", display:"Jack Morehouse"},
    "ellen marrett": {table:"oldfashioned", display:"Ellen Marrett"},
    "carol plummer": {table:"oldfashioned", display:"Carol Plummer"},
    "tanesha allen": {table:"oldfashioned", display:"Tanesha Allen"},
    "andrea plummer": {table:"oldfashioned", display:"Andrea Plummer"},
    "jacqueline panton": {table:"oldfashioned", display:"Jacqueline Panton"},
    "albert williams": {table:"oldfashioned", display:"Albert Williams"},
    "nicole panton": {table:"oldfashioned", display:"Nicole Panton"},
    "sharon plummer": {table:"oldfashioned", display:"Sharon Plummer"},

    /* MORNING COFFEE */
    "aidan russell": {table:"morningcoffee", display:"Aidan Russell"},
    "anjali russell": {table:"morningcoffee", display:"Anjali Russell"},
    "amayah russell": {table:"morningcoffee", display:"Amayah Russell"},
    "arianno russell": {table:"morningcoffee", display:"Arianno Russell"},
    "alena russell": {table:"morningcoffee", display:"Alena Russell"},
    "felicia marrett": {table:"morningcoffee", display:"Felicia Marrett"},


    /* TRAVELING TOGETHER */
    "matt mamula": {table:"travelingtogether", display:"Matt Mamula"},
    "christy micca": {table:"travelingtogether", display:"Christy Micca"},
    "betsy funke": {table:"travelingtogether", display:"Betsy Funke"},
    "tami funke": {table:"travelingtogether", display:"Tami Funke"},
    "greg kutz": {table:"travelingtogether", display:"Greg Kutz"},
    "kalyn kutz": {table:"travelingtogether", display:"Kalyn Kutz"},
    "betsy reuteman": {table:"travelingtogether", display:"Betsy Reuteman"},
    "justin garcia": {table:"travelingtogether", display:"Justin Garcia"}
};

const searchBox = document.getElementById("searchBox");
const result = document.getElementById("result");
const viewport = document.getElementById("viewport");
const marker = document.getElementById("marker");
const label = document.getElementById("label");
const defaultContent = result.innerHTML;

function toggle(el, show) {
    el.classList.toggle("visible", show);
}

function resetUI() {
    toggle(viewport, false);
    toggle(marker, false);
    toggle(label, false);
}

function showTable(table) {
    marker.style.left = label.style.left = table.x + "%";
    marker.style.top = label.style.top = table.y + "%";
    label.textContent = table.label + " Table";
    toggle(viewport, true);
    toggle(marker, true);
    toggle(label, true);
}

function findGuest(input) {
    let partial = null;
    for (const name in guests) {
        if (name === input) return guests[name];
        if (!partial && name.includes(input)) {
            partial = guests[name];
        }
    }
    return partial;
}

let debounceTimer;

searchBox.addEventListener("input", e => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        const input = e.target.value.trim().toLowerCase();

        if (!input) {
            resetUI();
            result.innerHTML = defaultContent;
            return;
        }

        const guest = findGuest(input);

        if (!guest) {
            result.textContent = "Name not found. Please check spelling.";
            resetUI();
            return;
        }

        result.innerHTML = `
            We are so happy to have you celebrating with us,<br>
            <strong style="color:#4A5D23;font-size:26px;">
            ${guest.display}
            </strong>!
        `;

        showTable(tablePositions[guest.table]);
    }, 120);
});
</script>

</body>
</html>
