<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find Your Seat – Jordein & Mari's Wedding</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --olive: #556B2F;
    --moss: #4A5D23;
    --maroon: #3C0008;
    --brown: #654321;
    --ivory: #FFFFF0;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    color: var(--brown);
    background: linear-gradient(135deg, var(--ivory), #f3f1e6);
}

/* Main Card */
.overlay {
    max-width: 920px;
    margin: 40px auto;
    padding: 40px 32px;
    border-radius: 26px;
    background: var(--ivory);
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.12);
    border: 1px solid rgba(85,107,47,0.2);
    animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    margin: 0;
    font-size: clamp(36px, 6vw, 48px);
    color: var(--maroon);
}

h2 {
    margin-top: 8px;
    font-size: clamp(18px, 4vw, 24px);
    color: var(--olive);
}

p { margin-top: 16px; }

/* Input */
input {
    width: 100%;
    max-width: 380px;
    padding: 14px;
    font-size: 18px;
    border-radius: 16px;
    border: 2px solid var(--olive);
    margin-top: 18px;
    background: white;
    color: var(--brown);
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: var(--maroon);
    box-shadow: 0 0 0 5px rgba(60,0,8,0.15);
}

/* Result Card */
.result {
    margin-top: 28px;
    padding: 28px;
    border-radius: 20px;
    background: white;
    font-size: 18px;
    min-height: 120px;
    border: 1px solid rgba(101,67,33,0.2);
    box-shadow: 0 10px 28px rgba(0,0,0,0.08);
}

/* Couple Photo */
.couple-photo {
    margin: 24px auto;
    width: 100%;
    max-width: 540px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,0.18);
}

.couple-photo img {
    width: 100%;
    display: block;
}

/* Floorplan */
.floorplan-viewport {
    margin: 32px auto 0;
    width: 100%;
    max-width: 820px;
    border-radius: 20px;
    overflow: hidden;
    background: var(--ivory);
    border: 1px solid rgba(74,93,35,0.25);
    box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    display: none;
}

.floorplan-container {
    position: relative;
}

.floorplan-container img {
    width: 100%;
    display: block;
}

/* Marker */
.table-marker {
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--maroon);
    border: 4px solid var(--ivory);
    transform: translate(-50%, -50%);
    display: none;
    animation: pulse 2s infinite ease-in-out;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 8px rgba(85,107,47,0.25); }
    50% { box-shadow: 0 0 0 14px rgba(85,107,47,0.15); }
    100% { box-shadow: 0 0 0 8px rgba(85,107,47,0.25); }
}

/* Label */
.table-label {
    position: absolute;
    transform: translate(-50%, -140%);
    background: var(--olive);
    padding: 8px 16px;
    border-radius: 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ivory);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    white-space: nowrap;
    display: none;
}

/* Visibility Utility */
.visible { display: block !important; }

/* Footer */
.footer {
    margin-top: 30px;
    font-size: 16px;
    color: var(--moss);
}
</style>
</head>

<body>

<div class="overlay">
    <h1>Welcome</h1>
    <h2>Jordein & Mari's Wedding</h2>

    <p>Search your name to find your seat</p>
    <input id="searchBox" placeholder="Enter your first or full name">

    <div id="result" class="result">
        <div class="couple-photo">
            <img src="https://nomanisanisland8.wordpress.com/wp-content/uploads/2026/02/img_0567.png" alt="Jordein & Mari">
        </div>
    </div>

    <div id="viewport" class="floorplan-viewport">
        <div class="floorplan-container">
            <img src="https://nomanisanisland8.wordpress.com/wp-content/uploads/2026/02/img_0557.jpg" alt="Floorplan">
            <div id="marker" class="table-marker"></div>
            <div id="label" class="table-label"></div>
        </div>
    </div>

    <div class="footer">
        We are so happy to celebrate with you 🤍
    </div>
</div>

<script>

    "denise mcneill": {table:"southshore", display:"Denise McNeill"},
    "leeann terhune": {table:"southshore", display:"LeeAnn Terhune"},

    /* TRAVELING TOGETHER */

    "tami funke": {table:"travelingtogether", display:"Tami Funke"},
    "greg kutz": {table:"travelingtogether", display:"Greg Kutz"},
    "kalyn kutz": {table:"travelingtogether", display:"Kalyn Kutz"},
    "betsy reuteman": {table:"travelingtogether", display:"Betsy Reuteman"},
    "justin garcia": {table:"travelingtogether", display:"Justin Garcia"}

};

const searchBox = document.getElementById("searchBox");
const result = document.getElementById("result");
const viewport = document.getElementById("viewport");
const marker = document.getElementById("marker");
const label = document.getElementById("label");
const defaultContent = result.innerHTML;

function toggle(el, show) {
    el.classList.toggle("visible", show);
}

function resetUI() {
    toggle(viewport, false);
    toggle(marker, false);
    toggle(label, false);
}

function showTable(table) {
    marker.style.left = label.style.left = table.x + "%";
    marker.style.top = label.style.top = table.y + "%";
    label.textContent = table.label + " Table";

    toggle(viewport, true);
    toggle(marker, true);
    toggle(label, true);
}

function findGuest(input) {
    let partial = null;
    for (const name in guests) {
        if (name === input) return guests[name];
        if (!partial && name.includes(input)) {
            partial = guests[name];
        }
    }
    return partial;
}

let debounceTimer;

searchBox.addEventListener("input", e => {
    clearTimeout(debounceTimer);

    debounceTimer = setTimeout(() => {
        const input = e.target.value.trim().toLowerCase();

        if (!input) {
            resetUI();
            result.innerHTML = defaultContent;
            return;
        }

        const guest = findGuest(input);

        if (!guest) {
            result.textContent = "Name not found. Please check spelling.";
            resetUI();
            return;
        }

        result.innerHTML = `
            We are so happy to have you celebrating with us,
            <strong style="color: var(--maroon);">${guest.display}</strong>!
        `;

        showTable(tablePositions[guest.table]);

    }, 120);
});
</script>

</html>
